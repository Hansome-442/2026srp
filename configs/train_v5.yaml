# =============================================================================
#  YOLOv11 训练配置 v5：在 v4 权重上继续训练（v4 诊断为"欠拟合，可继续训"）
#  · 起点：runs/train/classroom_v4_80ep/weights/best.pt（已在 4.2 万张数据上训 50 轮）
#  · 学习率降到 0.008（微调，避免把已学好的特征打散）
#  · 40 轮 + cos_lr，close_mosaic 10，patience 15
#  · 数据沿用 data/processed（不重建，pipeline 加 -SkipPrepare）
# =============================================================================

data: data/dataset.yaml

model: runs/train/classroom_v4_80ep/weights/best.pt

epochs: 40
imgsz: 640
batch: 12
device: 0
workers: 4
patience: 15
optimizer: SGD
lr0: 0.008
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 1.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05
cos_lr: true
dropout: 0.0

box: 7.5
cls: 0.5
dfl: 1.5
cls_pw: 0.35

mosaic: 0.8
close_mosaic: 10
mixup: 0.05
copy_paste: 0.0
degrees: 5.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
erasing: 0.4
multi_scale: 0.25

amp: true
cache: false
rect: false
val: true
plots: true
save_period: -1
seed: 0
deterministic: false

project: runs/train
name: classroom_v5_40ep
